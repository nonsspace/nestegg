name: Daily price snapshot

on:
  schedule:
    # 21:00 UTC — TCGCSV rebuilds around 20:00 UTC, so this runs after it lands.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect prices
        run: node collect.js

      - name: Compute signals
        run: node analyze.js

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
